<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Your Experience - Tea Land</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .chip-active { background-color: #2563eb !important; color: white !important; }
  </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="bg-white max-w-md w-full rounded-2xl shadow-xl p-6 border border-gray-100 text-center">
    
    <!-- Header -->
    <h2 class="text-xl font-bold text-gray-800 mb-1">Tea Land Bharatpur</h2>
    <p class="text-sm text-gray-500 mb-6">आपका अनुभव कैसा रहा? रेटिंग चुनें</p>

    <!-- Step 1: Star Rating -->
    <div class="flex justify-center gap-2 mb-6 text-4xl cursor-pointer" id="starContainer">
      <span onclick="rate(1)" class="star text-gray-300">★</span>
      <span onclick="rate(2)" class="star text-gray-300">★</span>
      <span onclick="rate(3)" class="star text-gray-300">★</span>
      <span onclick="rate(4)" class="star text-gray-300">★</span>
      <span onclick="rate(5)" class="star text-gray-300">★</span>
    </div>

    <!-- Step 2A: Bad Review Form (1 to 3 Stars) -->
    <div id="badReviewBox" class="hidden text-left">
      <p class="text-sm text-red-600 font-medium mb-2">हमें खेद है! कृपया बताएं क्या कमी रह गई:</p>
      <textarea id="badFeedback" rows="3" class="w-full border rounded-xl p-3 text-sm focus:outline-blue-500" placeholder="स्वाद, सर्विस या साफ-सफाई में क्या कमी लगी?"></textarea>
      <button onclick="sendPrivateFeedback()" class="mt-3 w-full bg-red-600 hover:bg-red-700 text-white font-medium py-3 rounded-xl transition">
        मैनेजर को डायरेक्ट WhatsApp भेजें
      </button>
    </div>

    <!-- Step 2B: Good Review Flow (4 to 5 Stars) -->
    <div id="goodReviewBox" class="hidden text-left">
      <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">आपको क्या सबसे अच्छा लगा? (टैप करें)</p>
      
      <!-- Quick Chips / Tags -->
      <div class="flex flex-wrap gap-2 mb-4">
        <button type="button" onclick="toggleTag(this, 'यहाँ की चाय का स्वाद और स्नैक्स बहुत ही लाजवाब हैं।')" class="tag border border-gray-200 bg-gray-50 text-gray-700 text-xs px-3 py-2 rounded-full transition">☕ लाजवाब चाय</button>
        <button type="button" onclick="toggleTag(this, 'स्टाफ का व्यवहार बहुत बढ़िया और सर्विस काफी तेज़ है।')" class="tag border border-gray-200 bg-gray-50 text-gray-700 text-xs px-3 py-2 rounded-full transition">⚡ तेज़ सर्विस</button>
        <button type="button" onclick="toggleTag(this, 'भरतपुर में चाय और सुकून के पलों के लिए सबसे बेहतरीन जगह।')" class="tag border border-gray-200 bg-gray-50 text-gray-700 text-xs px-3 py-2 rounded-full transition">✨ बेस्ट माहौल</button>
        <button type="button" onclick="toggleTag(this, 'दोस्तों के साथ हैंगआउट और गपशप करने के लिए परफेक्ट स्पॉट।')" class="tag border border-gray-200 bg-gray-50 text-gray-700 text-xs px-3 py-2 rounded-full transition">👥 फ्रेंड्स अड्डा</button>
      </div>

      <!-- Auto-Generated Text Area -->
      <label class="text-xs text-gray-500 font-medium mb-1 block">आपका रिव्यू (आप खुद भी एडिट कर सकते हैं):</label>
      <textarea id="reviewText" rows="3" class="w-full border rounded-xl p-3 text-sm focus:outline-blue-500 text-gray-800" placeholder="ऊपर दिए गए ऑप्शन्स चुनें या यहाँ लिखें..."></textarea>

      <!-- Submit / Copy & Open Google Button -->
      <button onclick="submitToGoogle()" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-blue-200 transition">
        <span>Google पर पोस्ट करें</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
      <p class="text-[11px] text-gray-400 text-center mt-2">बटन दबाते ही टेक्स्ट कॉपी हो जाएगा, बस गूगल पर पेस्ट कर दें।</p>
    </div>

  </div>

  <script>
    // ✅ Tea Land Bharatpur का Review Link
    const GOOGLE_REVIEW_URL = "https://www.google.com/travel/search?q=tea%20land%20bharatpur&g2lb=4965990%2C72471280%2C72573224%2C72686036%2C72803964%2C72882230%2C73064764%2C121529350%2C121608706%2C121738283%2C121921501%2C121951222%2C122035345%2C122078727%2C122093076%2C122097177%2C122121959%2C122134888&hl=en-IN&gl=in&ssta=1&ts=CAEaKwopEicyJTB4Mzk3M2EzYjVlZjRmMGU5ZDoweGU0Nzk0MjczZmEwZTRlOWU&qs=CAEyFENnc0lucDI1MExfTzBMemtBUkFCOAI&ap=ugEHcmV2aWV3cw&ictx=111&ved=0CAAQ5JsGahcKEwiAkun2x_-XAxUAAAAAHQAAAAAQBQ";

    // ✅ आपका WhatsApp Number (Country code 91 के साथ)
    const OWNER_WHATSAPP_NUMBER = "917231890891";

    let selectedRating = 0;
    let selectedSentences = [];

    function rate(n) {
      selectedRating = n;
      const stars = document.querySelectorAll('.star');
      stars.forEach((s, idx) => {
        s.classList.toggle('text-yellow-400', idx < n);
        s.classList.toggle('text-gray-300', idx >= n);
      });

      if (n <= 3) {
        document.getElementById('badReviewBox').classList.remove('hidden');
        document.getElementById('goodReviewBox').classList.add('hidden');
      } else {
        document.getElementById('badReviewBox').classList.add('hidden');
        document.getElementById('goodReviewBox').classList.remove('hidden');
      }
    }

    function toggleTag(btn, sentence) {
      const index = selectedSentences.indexOf(sentence);
      if (index > -1) {
        selectedSentences.splice(index, 1);
        btn.classList.remove('chip-active');
      } else {
        selectedSentences.push(sentence);
        btn.classList.add('chip-active');
      }
      document.getElementById('reviewText').value = selectedSentences.join(" ");
    }

    function submitToGoogle() {
      const text = document.getElementById('reviewText').value;
      
      // क्लिपबोर्ड पर टेक्स्ट कॉपी करना और सीधे Tea Land का Google Review पेज खोलना
      if (navigator.clipboard && text) {
        navigator.clipboard.writeText(text).then(() => {
          window.location.href = GOOGLE_REVIEW_URL;
        }).catch(() => {
          window.location.href = GOOGLE_REVIEW_URL;
        });
      } else {
        window.location.href = GOOGLE_REVIEW_URL;
      }
    }

    function sendPrivateFeedback() {
      const feedback = document.getElementById('badFeedback').value;
      if (!feedback.trim()) {
        alert("कृपया अपनी समस्या लिखें।");
        return;
      }
      const msg = encodeURIComponent("🚨 *Tea Land Bharatpur - Feedback Alert* 🚨\nRating: " + selectedRating + " Stars\nIssue: " + feedback);
      window.location.href = `https://wa.me/${OWNER_WHATSAPP_NUMBER}?text=${msg}`;
    }
  </script>
</body>
</html>
